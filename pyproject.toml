[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-web-crawler"
version = "0.2.0"
description = "Fault-tolerant Redis-backed distributed web crawler"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12,<4",
  "protego>=0.6,<1",
  "redis>=6.2,<8",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
distributed-crawler = "distributed_crawler.cli:main"
crawler-fixture = "distributed_crawler.fixture:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
